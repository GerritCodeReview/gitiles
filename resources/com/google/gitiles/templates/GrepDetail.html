<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{Common :: head(title=${title}, repositoryName=${repositoryName}, css=null, customVariant=${customVariant})}">
</head>
<body class="Site">
  <header th:replace="~{Common :: siteHeader(menuEntries=${menuEntries}, customVariant=${customVariant})}"></header>
  <div class="Site-content">
    <div class="Container">
      <div th:replace="~{Common :: breadcrumbs(breadcrumbs=${breadcrumbs})}"></div>
      <form method="GET" class="GrepSearch"><input type="text" name="s" th:value="${substring}" class="GrepSearch-input"><button type="submit" class="GrepSearch-button">Search</button></form>
      <p th:if="${path != null and path != ''}" class="GrepSearch-path">Searching in <span class="u-monospace" th:text="${path}"></span></p>
      <th:block th:if="${hasSearch}">
        <ol th:if="${matches != null and !matches.isEmpty()}" class="GrepResults">
          <li th:each="match : ${matches}" class="GrepResults-item"><a class="u-monospace" th:href="${match.url}" th:text="${match.path}"></a><pre class="u-pre GrepResults-line"><code class="u-monospace" th:text="${match.lineNumber} + ': ' + ${match.line}"></code></pre></li>
        </ol>
        <p th:unless="${matches != null and !matches.isEmpty()}" class="GrepResults-empty">No matches.</p>
      </th:block>
    </div>
  </div>
  <footer th:replace="~{Common :: customFooter(customVariant=${customVariant})}"></footer>
</body>
</html>
