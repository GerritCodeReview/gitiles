<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background Squircle in Git Coral-Orange -->
  <rect width="512" height="512" rx="112" ry="112" fill="#F05133"/>

  <!-- UNIFIED WHITE FORK & RINGS -->
  <g fill="#FFFFFF" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Connecting Y Branch Lines (Thick 38px matching ring wall thickness) -->
    <line x1="256" y1="248" x2="256" y2="366" stroke-width="38"/>
    <line x1="256" y1="248" x2="152" y2="160" stroke-width="38"/>
    <line x1="256" y1="248" x2="360" y2="160" stroke-width="38"/>

    <!-- Center Junction Cap -->
    <circle cx="256" cy="248" r="19" stroke="none"/>

    <!-- Three Outer White Rings -->
    <circle cx="256" cy="366" r="58" stroke="none"/>
    <circle cx="152" cy="160" r="58" stroke="none"/>
    <circle cx="360" cy="160" r="58" stroke="none"/>
  </g>

  <!-- INNER HOLLOW DONUT CORES (Punched out with background color) -->
  <g fill="#F05133">
    <circle cx="256" cy="366" r="30"/>
    <circle cx="152" cy="160" r="30"/>
    <circle cx="360" cy="160" r="30"/>
  </g>
</svg>
