<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background Squircle / Rounded Tile in Git Coral-Orange -->
  <rect width="512" height="512" rx="112" ry="112" fill="#F05133"/>

  <!-- Connecting Trunk and Branch Arms (Thick Solid White) -->
  <!-- Bottom Vertical Stem -->
  <line x1="256" y1="256" x2="256" y2="360" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round"/>
  <!-- Top-Left Diagonal Arm -->
  <line x1="256" y1="256" x2="152" y2="166" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round"/>
  <!-- Top-Right Diagonal Arm -->
  <line x1="256" y1="256" x2="360" y2="166" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round"/>

  <!-- Three Commit Node Rings (White Outer Ring with Orange Hollow Core) -->
  <!-- Bottom Ring -->
  <circle cx="256" cy="360" r="54" fill="#FFFFFF"/>
  <circle cx="256" cy="360" r="28" fill="#F05133"/>

  <!-- Top-Left Ring -->
  <circle cx="152" cy="166" r="54" fill="#FFFFFF"/>
  <circle cx="152" cy="166" r="28" fill="#F05133"/>

  <!-- Top-Right Ring -->
  <circle cx="360" cy="166" r="54" fill="#FFFFFF"/>
  <circle cx="360" cy="166" r="28" fill="#F05133"/>
</svg>
